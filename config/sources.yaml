# 信息源配置
# 每个源必须独立：不同媒体/平台，不能是同一站点的两个入口
# adapter 字段指定适配器模块：rss = 通用 RSS 2.0/Atom；arxiv = ArXiv API 专用

sources:
  - id: openai
    name: OpenAI Blog
    adapter: rss
    type: rss
    url: https://openai.com/news/rss.xml
    lang: en
    homepage: https://openai.com/news
    enabled: true

  - id: techcrunch
    name: TechCrunch AI
    adapter: rss
    type: rss
    url: https://techcrunch.com/category/artificial-intelligence/feed/
    lang: en
    homepage: https://techcrunch.com/category/artificial-intelligence/
    enabled: true

  - id: hf_blog
    name: Hugging Face Blog
    adapter: rss
    type: rss
    url: https://huggingface.co/blog/feed.xml
    lang: en
    homepage: https://huggingface.co/blog
    enabled: true

  - id: hackernews
    name: Hacker News AI
    adapter: rss
    type: rss
    url: https://hnrss.org/newest?q=AI
    lang: en
    homepage: https://news.ycombinator.com/
    enabled: true

  - id: arxiv
    name: arXiv cs.AI
    type: api
    url: http://export.arxiv.org/api/query
    lang: en
    homepage: https://arxiv.org/list/cs.AI/recent
    enabled: true

# 时区口径说明（README 需对应说明）
# - published_at: 保留源原时区，存储为 ISO8601 带时区
# - fetched_at: 采集时刻，UTC
# - 界面展示统一按 Asia/Shanghai
display_timezone: Asia/Shanghai
