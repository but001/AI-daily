# 信息源配置
# 每个源必须独立：不同媒体/平台，不能是同一站点的两个入口

sources:
  - id: arxiv
    name: ArXiv cs.AI
    type: api
    url: http://export.arxiv.org/api/query
    lang: en
    homepage: https://arxiv.org/list/cs.AI/recent
    enabled: true

  - id: jiqizhixin
    name: 机器之心
    type: rss
    url: https://www.jiqizhixin.com/rss
    lang: zh
    homepage: https://www.jiqizhixin.com
    # RSS URL 当前返回非合法 XML，停用备用；修复 URL 后改 true 即可启用
    enabled: false

  - id: huggingface_papers
    name: Hugging Face Papers
    type: api
    url: https://huggingface.co/api/daily_papers
    lang: en
    homepage: https://huggingface.co/papers
    enabled: true

  - id: baai_hub
    name: 智源社区
    type: rss
    url: https://hub.baai.ac.cn/rss
    lang: zh
    homepage: https://hub.baai.ac.cn
    enabled: true

# 时区口径说明（README 需对应说明）
# - published_at: 保留源原时区，存储为 ISO8601 带时区
# - fetched_at: 采集时刻，UTC
# - 界面展示统一按 Asia/Shanghai
display_timezone: Asia/Shanghai

# 最近 N 天的范围口径（题目要求"最近7天"）
recent_days: 7
